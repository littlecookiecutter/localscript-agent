version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: localscript-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: serve
    restart: unless-stopped

  app:
    build: .
    container_name: localscript-app
    ports:
      - "8080:8080"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b-instruct-q4_k_m
      - PYTHONPATH=/app
      - USE_MOCK=false
    command: >
      sh -c "
        echo 'Waiting for Ollama to be ready...';
        while ! curl -s http://ollama:11434/api/tags >/dev/null 2>&1; do
          echo '  Ollama not ready, waiting 2s...';
          sleep 2;
        done;
        echo 'Ollama is ready. Starting application...';
        uvicorn src.api.main:app --host 0.0.0.0 --port 8080
      "
    restart: unless-stopped

volumes:
  ollama_data: